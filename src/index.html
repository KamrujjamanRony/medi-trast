<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Medi-Trust Engineers — Medical Equipment Supplier</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Medi-Trust Engineers supplies surgical, medical, laboratory and dental equipment, medical furniture and accessories across Bangladesh.">
  <meta name="theme-color" content="#00a393">

  <!--
    Content-Security-Policy. This is the main defence against injected malware:
    even if an attacker manages to get markup onto a page, the browser will
    refuse to run script that is not served from this origin, and will refuse to
    contact hosts that are not listed here.

    web.config sends the authoritative policy as a response header (which also
    carries frame-ancestors). This meta tag is the fallback for any host that
    does not apply web.config. Keep the two in sync.

    use.fontawesome.com and fonts.cdnfonts.com were removed along with the
    FontAwesome and Bauhaus 93 stylesheets: icons are inline SVG now, so the
    policy no longer has to trust two extra third-party origins.
  -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    base-uri 'self';
    object-src 'none';
    form-action 'self';
    script-src 'self';
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
    font-src 'self' data: https://fonts.gstatic.com;
    img-src 'self' data: blob: https://mec.supersoftbd.com;
    connect-src 'self' https://mec.supersoftbd.com;
    frame-src https://maps.google.com https://www.google.com;
    media-src 'self';
    worker-src 'self' blob:;
    manifest-src 'self';
    upgrade-insecure-requests;
  ">
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!-- Fonts are loaded from the stylesheet so the browser only fetches the
       weights actually used; preconnect removes a round trip. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
</head>
<body>
  <app-root></app-root>
</body>
</html>

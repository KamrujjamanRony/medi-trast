<!-- Render password input form if not authorized -->
@if (!isAuthorized) {
<div class="hero min-h-screen bg-gradient-to-r from-cyan-500 to-blue-500">
  <div class="hero-content">
    <div class="card shrink-0 w-full max-w-sm shadow-2xl bg-base-100 mx-auto">
      <h1 class="text-xl md:text-2xl lg:text-3xl text-center font-bold pt-5">
        Admin Panel
      </h1>
      <form (submit)="onSubmitAuth($event)" class="card-body" autocomplete="off">
        <label for="password">Enter Security Key:</label>
        <input
          type="password"
          id="password"
          class="input input-bordered"
          required
          [(ngModel)]="pass"
          [disabled]="checking"
          name="pass"
          autocomplete="current-password"
          spellcheck="false"
        />
        <label class="label">
          <span class="label-text-alt text-red-500">{{ err }}</span>
        </label>
        <div>
          <input
            type="submit"
            id="authorizeBtn"
            [value]="checking ? 'Checking…' : 'Authorize'"
            [disabled]="checking"
            class="btn btn-accent btn-md mt-2 w-full py-2 text-white"
          />
        </div>
      </form>
    </div>
  </div>
</div>
} @else {
<div
  class="min-h-screen flex flex-col flex-auto flex-shrink-0 antialiased bg-white dark:bg-gray-700 text-black dark:text-white"
  (click)="onAdminActivity()"
  (keydown)="onAdminActivity()"
>
  <app-sidebar />

  <div class="h-full ml-14 mt-14 mb-10 md:ml-40">
    <div class="flex justify-end pr-4">
      <button type="button" (click)="lock()" class="btn btn-sm btn-outline btn-error">
        Lock panel
      </button>
    </div>
    <router-outlet></router-outlet>
  </div>
</div>
}

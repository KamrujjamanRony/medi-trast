<!-- product-list.component.html -->

<div class="container mx-auto">
  <div class="text-center">
    <h1 class="text-5xl py-20">Our Products</h1>

    @if (loading) {
      <div
        class="block mt-10 mb-4 mx-auto h-12 w-12 animate-spin rounded-full border-4 border-solid border-current border-r-transparent align-[-0.125em] motion-reduce:animate-[spin_1.5s_linear_infinite]"
        role="status"
      >
        <span
          class="!absolute !-m-px !h-px !w-px !overflow-hidden !whitespace-nowrap !border-0 !p-0 ![clip:rect(0,0,0,0)]"
          >Loading...</span
        >
      </div>
    
      <div class="text-center">Loading...</div>
    } @else {
      <div
      class="grid xl:grid-cols-5 lg:grid-cols-4 md:grid-cols-3 grid-cols-1 justify-items-center gap-10"
    >
    @for (product of products$ | async | slice : 0 : 12; track $index) {<app-product-card [product]="product"></app-product-card>}
    </div>
    <a
      (click)="scrollToTopAndNavigate('/products/all')"
      class="btn btn-accent rounded text-white capitalize px-8 font-light text-xl my-12"
    >
      More
    </a>
    }
  </div>
</div>
